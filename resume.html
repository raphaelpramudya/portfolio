<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume | Raphael Portfolio</title>
  <meta name="description" content="Lihat dan unduh resume Raphael.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/resume_style.css">
  <link rel="stylesheet" href="css/nav.css">
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <header class="nav-wrap">
    <nav class="nav" aria-label="Navigasi utama">
      <a href="index.html" class="nav__link">Home</a>
      <a href="project.html" class="nav__link">Project</a>
      <a href="work.html" class="nav__link">Work</a>
      <a href="resume.html" class="nav__link is-active" aria-current="page">Resume</a>
    </nav>
  </header>

  <main class="resume">

    <!-- ===== JUDUL ===== -->
    <header class="resume__head">
      <h1 class="resume__title">Resume</h1>
      <p class="resume__intro">
        Take a look at my resume below, or download a copy to keep.
      </p>

      <div class="resume__actions">
        <a class="btn btn--dark" href="../assets/resume.pdf" download="Resume-Raphael-Pramudya.pdf">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 3v12m0 0l-5-5m5 5l5-5M4 19h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Download Resume</span>
        </a>

        <a class="btn btn--light" href="assets/resume.pdf" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Open in New Tab</span>
        </a>
      </div>
    </header>

    <!-- ===== PREVIEW ===== -->
    <section class="resume__preview" aria-label="Preview resume">
      <object class="resume__frame" data="../assets/resume.pdf#toolbar=0&navpanes=0&view=FitH" type="application/pdf">
        <!-- tampil jika browser tidak bisa menampilkan PDF (umumnya di ponsel) -->
        <div class="resume__fallback">
          <p>Preview tidak bisa ditampilkan di perangkat ini.</p>
          <a class="btn btn--dark" href="../assets/resume.pdf" download="Resume-Raphael-Pramudya.pdf">Download Resume</a>
        </div>
      </object>
    </section>

  </main>

</body>
</html>
